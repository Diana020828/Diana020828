<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Diana Pinzón — Marketing Automation Specialist. n8n, Zapier, GoHighLevel, Webflow, React, Astro. portfoliodiana.netlify.app">
  <title>Diana Pinzón — Marketing Automation Specialist</title>

  <defs>
    <!-- Fondo: marrón cálido oscuro, mismo tono base del portfolio -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241C18"/>
      <stop offset="60%" stop-color="#2E2420"/>
      <stop offset="100%" stop-color="#3B2F2A"/>
    </linearGradient>

    <!-- Halo terracota arriba a la derecha -->
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.62">
      <stop offset="0%" stop-color="#C1663A" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#C1663A" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#C1663A" stop-opacity="0"/>
    </radialGradient>

    <!-- Halo sage abajo a la izquierda, para que no sea monocromo -->
    <radialGradient id="glow2" cx="0.06" cy="0.95" r="0.5">
      <stop offset="0%" stop-color="#7FA07F" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7FA07F" stop-opacity="0"/>
    </radialGradient>

    <!-- Rejilla sutil: guiño al lienzo de un editor de workflows -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E8DCC8" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>
  <rect width="1200" height="400" fill="url(#glow2)"/>

  <!-- Nodos de workflow decorativos, esquina derecha -->
  <g opacity="0.5" fill="none" stroke="#C1663A" stroke-width="2">
    <path d="M955 296 h44" stroke-opacity="0.7"/>
    <path d="M1043 296 h44" stroke-opacity="0.7"/>
    <path d="M999 252 v-38 h88" stroke-opacity="0.35"/>
  </g>
  <g>
    <circle cx="943" cy="296" r="13" fill="#2E2420" stroke="#C1663A" stroke-width="2"/>
    <circle cx="1021" cy="296" r="13" fill="#C1663A"/>
    <circle cx="1099" cy="296" r="13" fill="#2E2420" stroke="#7FA07F" stroke-width="2"/>
    <circle cx="1099" cy="214" r="9" fill="#7FA07F" opacity="0.75"/>
  </g>

  <!-- Contenido -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="80" y="104" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace"
          font-size="21" letter-spacing="4.5" fill="#7FA07F">// MARKETING AUTOMATION</text>

    <text x="78" y="196" font-size="82" font-weight="700" letter-spacing="-1.5" fill="#F2EDE4">Diana Pinzón</text>

    <text x="80" y="248" font-size="31" font-weight="600" fill="#C1663A">Marketing Automation Specialist</text>

    <rect x="80" y="284" width="150" height="4" rx="2" fill="#C1663A"/>

    <text x="80" y="335" font-size="23" fill="#D8CCBB">n8n · Zapier · GoHighLevel · HubSpot · React · Astro</text>

    <text x="80" y="373" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace"
          font-size="18" letter-spacing="0.5" fill="#8B7355">portfoliodiana.netlify.app</text>
  </g>
</svg>

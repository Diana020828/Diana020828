<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="01 — The system I build">
  <title>01 — The system I build</title>
  <style>
    @font-face{font-family:'dp-display';src:url(data:font/ttf;base64,) format('truetype');}@font-face{font-family:'dp-italic';src:url(data:font/ttf;base64,) format('truetype');}@font-face{font-family:'dp-bold';src:url(data:font/ttf;base64,) format('truetype');}
    
    .rise { animation: rise 0.9s cubic-bezier(.16,1,.3,1) both; }
    @keyframes rise { from { transform: translateY(70px); } to { transform: none; } }
    .fade { animation: fade 0.8s ease-out both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1200" height="120" fill="#F6F1E7"/>
  <rect x="0" y="0" width="1200" height="120" rx="0" fill="#E4DCF5" opacity="0.55"/>
  <rect x="40" y="40.0" width="56" height="40" rx="20" fill="#2A1B2E"/>
  <text x="68" y="66.0" text-anchor="middle" font-family="dp-bold" font-size="17" fill="#F6F1E7">01</text>
  <g clip-path="url(#t)">
    <g class="rise">
      <text x="118" y="78.0" font-family="dp-display" font-size="54" fill="#2A1B2E">The system</text>
      <text x="376.3" y="78.0" font-family="dp-italic" font-size="54" fill="#A63C24">I build</text>
    </g>
  </g>
  <defs><clipPath id="t"><rect x="0" y="8" width="1200" height="104"/></clipPath></defs>
  <circle cx="1150" cy="60.0" r="7" fill="#D2553A"/>
</svg>

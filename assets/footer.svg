<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Let's automate the busywork.">
  <title>Let's automate the busywork.</title>
  <style>
    @font-face{font-family:'dp-display';src:url(data:font/ttf;base64,) format('truetype');}@font-face{font-family:'dp-italic';src:url(data:font/ttf;base64,) format('truetype');}@font-face{font-family:'dp-body';src:url(data:font/ttf;base64,) format('truetype');}
    
    .rise { animation: rise 0.9s cubic-bezier(.16,1,.3,1) both; }
    @keyframes rise { from { transform: translateY(70px); } to { transform: none; } }
    .fade { animation: fade 0.8s ease-out both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <defs><filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="f"><rect x="0" y="40" width="1200" height="110"/></clipPath></defs>
  <clipPath id="card"><rect width="1200" height="260" rx="44"/></clipPath>
  <g clip-path="url(#card)">
    <rect width="1200" height="260" fill="#B7A6E3"/>
    <circle cx="1100" cy="40" r="140" fill="#D2553A" opacity="0.28" filter="url(#soft)"/>
  </g>
  <g clip-path="url(#f)">
    <g class="rise">
      <text x="64" y="128" font-family="dp-display" font-size="72" fill="#2A1B2E">Let's automate </text>
      <text x="498.0" y="128" font-family="dp-italic" font-size="72" fill="#A63C24">the busywork.</text>
    </g>
  </g>
  <text class="fade" style="animation-delay:.4s" x="66" y="190" font-family="dp-body" font-size="21" fill="#2A1B2E">Tell me which task your team repeats every day — a 30-minute call is enough to start.</text>
</svg>
